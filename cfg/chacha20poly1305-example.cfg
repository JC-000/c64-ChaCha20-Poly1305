# =============================================================================
# chacha20poly1305-example.cfg — starter ld65 config for a consumer linking
# c64-ChaCha20-Poly1305 as an archive.
#
# Shipped by `make lib` to build/lib/cfg/ alongside the archive. Not a
# contract requirement — §6.1 briefly required an example cfg and the
# clause was withdrawn at c64-lib-contract v1.1.1; this exists because the
# attributes below are load-bearing and a consumer needs them written
# down. Copy it into your own tree and adapt the
# MEMORY block; the two LIB_CHACHA20_POLY1305_* lines in SEGMENTS carry
# attributes that are load-bearing for correctness and constant-time
# behaviour, and are commented with the CONSEQUENCE of dropping each
# (SPEC §4). Copy those two lines verbatim.
#
# This is the CONSUMER-facing example. The library's own standalone build
# uses src/c64.cfg, which maps the same prefixed segments for the test and
# bench harness.
# =============================================================================

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    ZP:     file = "",  start = $0002, size = $009E, type = rw;
    HEADER: file = %O,  start = $0000, size = $0002;
    STUB:   file = %O,  start = $0801, size = $00FF, fill = yes;

    # Adjust to taste. Note the ceiling: the §8.1 quarter-square table is
    # placed by an EQUATE (LIB_SHARED_SQTAB_BASE, default $8000), not by a
    # segment, so ld65 does not know the region exists and will happily
    # place growing segments straight across it — linking clean and
    # corrupting the table at runtime, with no diagnostic at any stage.
    # Size MAIN to stop below the table, or relocate the table with
    # `ca65 -D LIB_SHARED_SQTAB_BASE=0x<addr>` (0x hex, never $ hex — a
    # `$` value is mangled by the shell and make into decimal 0, silently).
    # Mirror the library's own image guard in your program — the
    # three-line `.assert __MAIN_LAST__ <= ...` pattern in
    # "Mirror the sqtab image guard" in docs/INTEGRATION.md.
    #
    # PROFILE A CONSUMERS MUST SHRINK THIS. Profile A does not use sqtab at
    # all; it uses the Shoup per-r tables r_tab_lo/r_tab_hi, which are
    # equate-placed at $6000..$7FFF (src/lib/constants_lib.s) and are NOT
    # relocatable — there is no -D for them. The size below spans
    # $0900..$7FFF, so it runs straight across that window.
    #
    # CONSEQUENCE if you leave it: exactly the sqtab failure one region
    # lower. ld65 does not know the tables exist, places your growing
    # segments across them, links clean, and shoup_init then overwrites
    # whatever landed there — or your code overwrites the tables and every
    # Poly1305 multiply reads garbage. No diagnostic at any stage.
    #
    #   Profile B (default):  size = $7700   ; $0900..$7FFF, stops at sqtab
    #   Profile A:            size = $5700   ; $0900..$5FFF, stops at r_tab
    MAIN:   file = %O,  start = $0900, size = $7700;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,     type = zp;
    # `optional = yes`: a pure-assembly consumer has no crt0 and emits no
    # LOADADDR segment, and ld65 warns on every link without this. Keep it
    # if your program does emit one.
    LOADADDR:  load = HEADER, type = ro, optional = yes;
    BASICSTUB: load = STUB,   type = ro, optional = yes;

    # Your own code.
    CODE:      load = MAIN,   type = ro;

    # ---- Library code. REQUIRED align = $100 — a CT INVARIANT. --------------
    #
    # Three secret-indexed `.align 256` lookup tables live in this segment:
    # the two ChaCha20 nibswap LUTs (indexed by X derived from secret work
    # bytes) and poly_reduce_shl6_tab (indexed by Y derived from the
    # Poly1305 accumulator). They are aligned RELATIVE TO THIS SEGMENT, so
    # without page alignment here an indexed read crosses a page for some
    # indices and takes an extra cycle — making execution time depend on a
    # secret.
    #
    # CONSEQUENCE if dropped: ld65 emits only a WARNING and links the
    # tables misaligned anyway. As of v0.10.0 the library additionally
    # carries deferred `.assert ... lderror` guards on all three tables,
    # so a build without this attribute now fails the LINK instead of
    # shipping a timing leak. Do not rely on the warning: it fires only
    # because the library's sources carry `.align 256`, and a library
    # expressing alignment in its cfg alone would get no diagnostic at all.
    LIB_CHACHA20_POLY1305_CODE: load = MAIN, type = ro, align = $100;

    # Your own mutable data.
    DATA:      load = MAIN,   type = rw, optional = yes;

    # ---- Library data. REQUIRED type = rw in a file-emitting area. ----------
    #
    # These 295 bytes are relied upon to PRG-load as zero.
    #
    # CONSEQUENCE if set to `type = bss` (measured on ld65 V2.18 against
    # this library's real objects): there is NO diagnostic — not a warning,
    # not an error. The bss warning keys on the segment's byte values and
    # this segment is `.res` reservations, so it vanishes silently. 295
    # bytes leave the image, `sqtab_ready` then loads as power-on garbage,
    # `poly1305_init` skips the table build, and every Poly1305 multiply
    # reads an uninitialised quarter-square table — the PRG computes wrong
    # tags while looking healthy.
    #
    # If you REORDER so anything file-emitting sits after this segment, it
    # is worse: every byte past the hole loads 295 bytes below its linked
    # address. Keep bss-type segments last.
    LIB_CHACHA20_POLY1305_DATA: load = MAIN, type = rw;

    # bss-type segments stay last in the file-backed area.
    BSS:       load = MAIN,   type = bss, define = yes;
}
