# smoke_test.cfg — consumer-side ld65 linker config.
#
# This is deliberately separate from the library's own src/c64.cfg so that
# downstream projects can see what a consumer-owned link config looks like.
#
# The memory map matches the library's defaults because the library places
# its sqtab at $8000 (Profile B) and its Shoup r_tab_lo/hi at $6000/$7000
# (Profile A) by *equate* rather than by segment. A consumer that wants to
# relocate the sqtab passes `-D LIB_SHARED_SQTAB_BASE=0x<addr>`; the Shoup
# tables are not yet relocatable that way.
#
# Segment names: the library emits into the contract §4 prefixed segments
# LIB_CHACHA20_POLY1305_CODE / _DATA, not into plain CODE / DATA. A
# consumer cfg that omits them fails the link with "Missing memory area
# assignment for segment", so declaring them is a required adoption step —
# which is precisely why this example carries them.

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    ZP:     file = "",  start = $0002, size = $009E, type = rw;
    HEADER: file = %O,  start = $0000, size = $0002;
    STUB:   file = %O,  start = $0801, size = $00FF, fill = yes;
    # `define = yes` publishes __MAIN_LAST__, which smoke_test.s imports
    # for its §6.7 image guard: MAIN spans $0900-$9FFF and so *contains*
    # the equate-placed table windows, which ld65 knows nothing about. A
    # growing image could be linked straight across them with no error.
    # src/main.s carries the same guard for the library's own PRG and
    # says consumers must mirror it against their own `__<AREA>_LAST__`.
    MAIN:   file = %O,  start = $0900, size = $9700, define = yes;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,     type = zp;
    LOADADDR:  load = HEADER, type = ro;
    BASICSTUB: load = STUB,   type = ro;

    # Consumer code. Must stay first in MAIN so smoke_main lands on $0900
    # and the BASIC stub's SYS 2304 reaches it.
    CODE:      load = MAIN,   type = ro, align = $100;

    # Library code (contract §4 prefix).
    #
    # align = $100 is a CONSTANT-TIME INVARIANT, not a perf hint:
    # data_lib.s's two nibswap LUTs and poly1305_lib.s's
    # poly_reduce_shl6_tab are `.align 256` and are indexed by
    # secret-derived X/Y, so a page-cross would leak timing. Dropping the
    # attribute makes ld65 warn and then link them misaligned anyway — it
    # does not fail. Copy this line into your own cfg verbatim.
    LIB_CHACHA20_POLY1305_CODE: load = MAIN, type = ro, align = $100;

    # Consumer mutable data. Nothing here emits it; kept as a placeholder.
    DATA:      load = MAIN,   type = rw, optional = yes;

    # Library mutable data (contract §4 prefix). MUST stay `type = rw` in a
    # file-emitting area: these cells are relied upon to PRG-load as zero,
    # and ld65 gives no diagnostic if this is set to `bss`. See the header
    # note in src/lib/data_lib.s and the long comment in src/c64.cfg.
    LIB_CHACHA20_POLY1305_DATA: load = MAIN, type = rw;

    # bss-type segments MUST stay last in the file-backed MAIN area: ld65
    # writes no file bytes for bss, so a file-emitting segment declared
    # after a non-empty BSS loads __BSS_SIZE__ bytes below its linked
    # address — silent corruption with no link error.
    BSS:       load = MAIN,   type = bss, define = yes;
}
