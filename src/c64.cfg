FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    ZP:     file = "",  start = $0002, size = $009E, type = rw;
    HEADER: file = %O,  start = $0000, size = $0002;
    STUB:   file = %O,  start = $0801, size = $00FF, fill = yes;
    MAIN:   file = %O,  start = $0900, size = $9700;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,     type = zp;
    LOADADDR:  load = HEADER, type = ro;
    BASICSTUB: load = STUB,   type = ro;

    # Harness/consumer code. main.s's `lib_entry` stub lives here at
    # $0900 so the BASIC stub's SYS 2304 still lands on it. The library
    # no longer emits into plain CODE (issue #48, SPEC §4).
    CODE:      load = MAIN,   type = ro;

    # Library code (issue #48, SPEC §4 prefix).
    #
    # align = $100 is a CONSTANT-TIME INVARIANT, not a perf hint:
    # data_lib.s's two nibswap LUTs and poly1305_lib.s's
    # poly_reduce_shl6_tab are `.align 256` and are indexed by
    # secret-derived X/Y, so a page-cross would leak timing. ld65 only
    # WARNS when this attribute is missing and then links the tables
    # misaligned — the warning is the only signal, so keep this line.
    LIB_CHACHA20_POLY1305_CODE: load = MAIN, type = ro, align = $100;

    # Consumer mutable data. Nothing in-tree emits plain DATA after the
    # issue-#48 rename; kept as a placeholder for downstream code.
    DATA:      load = MAIN,   type = rw, optional = yes;

    # Library mutable data (issue #48, SPEC §4 prefix). MUST stay
    # `type = rw` in a file-emitting area: these cells are relied upon to
    # PRG-load as zero, and poly1305_init's `sqtab_ready` gate reads
    # power-on garbage if they don't. See the header note in
    # src/lib/data_lib.s.
    LIB_CHACHA20_POLY1305_DATA: load = MAIN, type = rw;

    # bss-type segments MUST stay last in the file-backed MAIN area:
    # ld65 writes no file bytes for bss, so a file-emitting segment
    # declared after a non-empty BSS loads __BSS_SIZE__ bytes below its
    # linked address — silent corruption with no link error.
    BSS:       load = MAIN,   type = bss, define = yes;
}
