FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    ZP:     file = "",  start = $0002, size = $009E, type = rw;
    HEADER: file = %O,  start = $0000, size = $0002;
    STUB:   file = %O,  start = $0801, size = $00FF, fill = yes;
    # `define = yes` publishes __MAIN_START__/__MAIN_LAST__/__MAIN_SIZE__.
    # __MAIN_LAST__ is load-bearing: src/main.s asserts the image does not
    # grow into the equate-placed sqtab window (contract v0.10.0 §6.7).
    # Publishing symbols emits no bytes — the PRG is byte-identical.
    MAIN:   file = %O,  start = $0900, size = $9700, define = yes;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,     type = zp;
    LOADADDR:  load = HEADER, type = ro;
    BASICSTUB: load = STUB,   type = ro;

    # Harness/consumer code. main.s's `lib_entry` stub lives here at
    # $0900 so the BASIC stub's SYS 2304 still lands on it. The library
    # no longer emits into plain CODE (issue #48, SPEC §4).
    CODE:      load = MAIN,   type = ro;

    # Library code (issue #48, SPEC §4 prefix).
    #
    # align = $100 is a CONSTANT-TIME INVARIANT, not a perf hint:
    # data_lib.s's two nibswap LUTs and poly1305_lib.s's
    # poly_reduce_shl6_tab are `.align 256` and are indexed by
    # secret-derived X/Y, so a page-cross would leak timing.
    #
    # CONSEQUENCE if dropped: ld65 emits a warning and then links the
    # tables misaligned anyway — it does not fail. Note the warning
    # fires because our SOURCES carry `.align 256`; ld65 checks the cfg
    # against that directive, not against the missing attribute
    # (contract v0.8.3). A library expressing alignment only in its cfg
    # would get no diagnostic at all, so do not rely on the warning as
    # a general safety net — and if these tables ever stop using
    # `.align`, this line becomes the only thing holding the invariant.
    LIB_CHACHA20_POLY1305_CODE: load = MAIN, type = ro, align = $100;

    # Consumer mutable data. Nothing in-tree emits plain DATA after the
    # issue-#48 rename; kept as a placeholder for downstream code.
    DATA:      load = MAIN,   type = rw, optional = yes;

    # Library mutable data (issue #48, SPEC §4 prefix). MUST stay
    # `type = rw` in a file-emitting area: these cells are relied upon to
    # PRG-load as zero. See the header note in src/lib/data_lib.s.
    #
    # CONSEQUENCE if set to `bss`, measured on ld65 V2.18 with this
    # library's real objects (issue #71). There is NO diagnostic — not a
    # warning, not an error. The bss warning keys on the segment's byte
    # values, and this segment is 19 `.res` reservations, so it vanishes
    # silently (contract v0.8.3). 295 bytes leave the image, and then
    # either:
    #
    #   _DATA last in the file-emitting area (as ordered below):
    #     addresses are unchanged, but poly1305_init's `sqtab_ready`
    #     gate reads power-on garbage, skips sqtab_init, and every
    #     Poly1305 multiplication reads an uninitialised table.
    #
    #   _DATA mid-area (anything file-emitting placed after it):
    #     far worse — every byte past the hole LOADS 295 bytes below its
    #     linked address. Measured: aead_encrypt still links at $4824
    #     and loads at $46FD. Such a build can appear to work by
    #     coincidence when the absent content is zeros.
    LIB_CHACHA20_POLY1305_DATA: load = MAIN, type = rw;

    # bss-type segments MUST stay last in the file-backed MAIN area:
    # ld65 writes no file bytes for bss, so a file-emitting segment
    # declared after a non-empty BSS loads __BSS_SIZE__ bytes below its
    # linked address — silent corruption with no link error.
    BSS:       load = MAIN,   type = bss, define = yes;
}
