FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    ZP:     file = "",  start = $0002, size = $009E, type = rw;
    HEADER: file = %O,  start = $0000, size = $0002;
    STUB:   file = %O,  start = $0801, size = $00FF, fill = yes;
    MAIN:   file = %O,  start = $0900, size = $9700;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,     type = zp;
    LOADADDR:  load = HEADER, type = ro;
    BASICSTUB: load = STUB,   type = ro, optional = yes;

    # The consumer's own code (min_aead_consumer.s / aead_smoke.s).
    CODE:      load = MAIN,   type = ro;

    # Library code (issue #48, SPEC §4 prefix). The `align = $100` is a
    # constant-time invariant — see src/c64.cfg for the full rationale.
    # Copy this line verbatim into your own cfg.
    LIB_CHACHA20_POLY1305_CODE: load = MAIN, type = ro, align = $100;

    # Consumer mutable data.
    DATA:      load = MAIN,   type = rw, optional = yes;

    # Library mutable data (issue #48, SPEC §4 prefix). MUST be
    # `type = rw` in a file-emitting area, never `type = bss`.
    # CONSEQUENCE if you get this wrong (measured, issue #71): a bss-type
    # segment writes no file bytes, and ld65 gives NO diagnostic at all —
    # not a warning, not an error. 295 bytes simply leave the image.
    #
    # With _DATA last in the file-emitting area, as ordered here,
    # `sqtab_ready` loads as power-on garbage instead of zero,
    # `poly1305_init` skips `sqtab_init`, and every Poly1305
    # multiplication reads an uninitialised quarter-square table — the
    # PRG computes wrong tags.
    #
    # If you REORDER these segments so anything file-emitting sits after
    # _DATA, the failure is worse: every byte past the hole loads 295
    # bytes below its linked address. Keep bss-type segments last.
    LIB_CHACHA20_POLY1305_DATA: load = MAIN, type = rw;

    # bss-type segments stay last in the file-backed MAIN area.
    BSS:       load = MAIN,   type = bss, define = yes;
}
